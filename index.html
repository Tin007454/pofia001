   สุขสันต์วันเกิดนะ หมาแก่ของผม ❤️🎂

แก่ขึ้นอีกปีแล้วนะครับ 5555 💗

วันเกิดปีนี้ผมก็ไม่รู้จะอวยพรอะไรให้พี่ดี เพราะผมอยากให้พี่มีความสุขในทุกๆวันอยู่แล้ว อยากให้พี่ได้เจอแต่เรื่องดีๆ มีคนใจดีกับพี่เยอะๆ อยากให้ทุกอย่างที่พี่ตั้งใจทำสำเร็จอย่างที่หวังไว้ แล้วก็อยากเห็นพี่ยิ้มได้แบบนี้ไปนานๆ เลย

ผมรู้ว่าในแต่ละวันพี่ต้องเจออะไรตั้งมากมาย บางวันก็เหนื่อย บางวันก็มีเรื่องให้คิดเยอะแยะ แต่ผมอยากให้พี่รู้ไว้นะว่าพี่เก่งมากๆแล้ว ไม่จำเป็นต้องเก่งไปกว่านี้ก็ได้ ไม่ต้องฝืนยิ้มในวันที่ไม่ไหวด้วย ถ้าวันไหนเหนื่อยก็กลับมางอแงกับผมได้นะ ผมอาจจะไม่ได้เก่งเรื่องปลอบใจ แต่ผมจะอยู่ข้างๆ พี่ปอฝ้ายเอง

ขอบคุณที่เข้ามาในชีวิตผม ขอบคุณที่ทำให้วันธรรมดาๆของผมมันไม่ธรรมดา555555 ขอบคุณที่คอยอยู่ด้วยกัน ไม่ว่าจะเป็นวันที่เราหัวเราะด้วยกัน หรือวันที่เราโกรธกันจนไม่อยากคุยกันผมดีใจจริงๆ นะที่ได้มีพี่อยู่ตรงนี้

ผมไม่รู้หรอกว่าอนาคตจะเป็นยังไง เราจะต้องเจอเรื่องอะไรอีกบ้างทั้งดีและไม่ดี แต่ผมอยากอยู่ฉลองวันเกิดกับ พี่ปอฝ้าย ไปอีกหลายๆ ปีเลย อยากเห็นพี่เติบโต อยากเห็นพี่ทำสิ่งที่ฝันไว้สำเร็จ อยากเป็นคนที่ได้อยู่ข้างๆ แล้วบอกพี่ว่า "เห็นมั้ย พี่ปอฝ้าย ทำได้แล้ว ผมบอกแล้วว่าพี่เก่ง" 

แล้วก็ขอโทษด้วยนะ ถ้าบางครั้งเค้าทำตัวไม่น่ารัก พูดอะไรไม่คิดโดยเฉพาะตอนเมา หรือทำให้เธอต้องเสียใจ ผมอาจจะไม่ใช่แฟนที่ดี แต่เค้าจะพยายามดูแลความรักของเราให้ดีที่สุดเท่าที่ผมจะทำได้

ปีนี้ขอให้พี่รักตัวเองเยอะๆ อย่ากดดันตัวเองมากเกินไป อย่าลืมกินข้าวให้ตรงเวลา พักผ่อนเยอะๆ แล้วก็อย่าเก็บทุกเรื่องมาคิดคนเดียว เพราะตอนนี้พี่มีผมแล้วนะ มีอะไรก็บอกกันได้เสมอ

**สุดท้ายนี้ ผมอยากบอกว่า ผมดีใจมากๆที่ผมได้รู้จัก พี่ปอฝ้าย ถึงจะไม่ถูกที่ถูกเวลาเท่าไหร่ แต่ดีใจยิ่งกว่าที่วันหนึ่งเราได้มาเจอกัน**

ไม่รู้ว่าผมจะทำให้ทุกวันของพี่เป็นวันที่ดีได้ไหม แต่ผมสัญญาว่าจะพยายามไม่เป็นเหตุผลที่ทำให้พี่ต้องเสียใจ

สุขสันต์วันเกิดอีกครั้งนะคะ หมาแก่คนเก่งของผม 🎂❤️

<template id="memory"><img class="theme-sticker" src="assets/icon-memory.webp" alt="Jun Lemon กับความทรงจำ"><h2 id="modalTitle">ความทรงจำของเรา ♡</h2><img id="photo" alt="ภาพตัวอย่างดวงดาวรูปหัวใจ"><p class="caption">ตรงนี้เก็บรูปของเราได้อีกหนึ่งความทรงจำ</p><label class="upload">เลือกรูปจากเครื่อง<input id="photoInput" type="file" accept="image/*"></label><p class="caption">รูปแสดงเฉพาะในหน้านี้ ไม่อัปโหลด และหายเมื่อปิดหน้า</p></template>
<template id="wish"><img class="theme-sticker" src="assets/icon-wish.webp" alt="Jun Lemon ส่งคำอวยพร"><h2 id="modalTitle">คำอวยพรเล็ก ๆ ให้หมาแก่</h2><p>ลองเลือกดูรูปดูๆ55555</p><div class="cards"><button class="fortune" data-card="0" aria-label="เปิดคำอวยพรใบที่ 1"><img src="assets/card-1.jpg" alt="รูปความทรงจำใบที่ 1"></button><button class="fortune" data-card="1" aria-label="เปิดคำอวยพรใบที่ 2"><img src="assets/card-2.jpg" alt="รูปความทรงจำใบที่ 2"></button><button class="fortune" data-card="2" aria-label="เปิดคำอวยพรใบที่ 3"><img src="assets/card-3.jpg" alt="รูปความทรงจำใบที่ 3"></button></div><p id="fortuneText" aria-live="polite">ดวงไหนกำลังเรียกเธออยู่?</p></template>
<script>
let entered=false,entryProgress=0;
const canvas=document.querySelector('#universe'),ctx=canvas.getContext('2d');let W=0,H=0,D=1,time=0,yaw=0,drag=false,lastX=0,lastT=0,playing=!matchMedia('(prefers-reduced-motion: reduce)').matches;
let seed=19;function rand(){seed=(seed*1664525+1013904223)>>>0;return seed/4294967296}const stars=Array.from({length:250},()=>({x:rand(),y:rand(),r:rand()*1.1+.2,a:rand(),p:rand()*6.28}));const heart=[];
for(let i=0;i<3600;i++){const u=rand()*Math.PI*2,v=rand()*Math.PI;const x=16*Math.pow(Math.sin(u),3),y=13*Math.cos(u)-5*Math.cos(2*u)-2*Math.cos(3*u)-Math.cos(4*u);const thickness=Math.sin(v);heart.push({x:x*thickness/16,y:(y*thickness+1)/16,z:Math.cos(v)*.33*Math.sin(u)*Math.sin(u),r:.45+rand()*1.1,p:rand()*6.28})}
const disk=Array.from({length:7500},()=>{const r=.15+Math.pow(rand(),.72)*2.8,a=rand()*Math.PI*2;return{r,a:a+r*3.3,arm:Math.floor(rand()*3),s:rand()*.9+.25,j:(rand()-.5)*.09}});
function size(){W=innerWidth;H=innerHeight;D=Math.min(devicePixelRatio||1,1.8);canvas.width=Math.round(W*D);canvas.height=Math.round(H*D);ctx.setTransform(D,0,0,D,0,0);draw()}
function draw(){if(!W)return;ctx.globalCompositeOperation='source-over';ctx.fillStyle='#f8f7ed';ctx.fillRect(0,0,W,H);const reveal=entered?Math.max(.025,entryProgress):1;const zoom=.1+.9*(1-Math.pow(1-reveal,3));const scale=Math.min(W*.32,H*.32)*zoom,cx=W/2,cy=H*.36,base=H*.64;let g=ctx.createRadialGradient(cx,cy,0,cx,cy,scale*2);g.addColorStop(0,'#bbdecf70');g.addColorStop(.6,'#f2d4dd40');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(const s of stars){ctx.fillStyle=`rgba(94,139,107,${(.2+s.a*.5)*(.75+.25*Math.sin(time+s.p))})`;ctx.beginPath();ctx.arc(s.x*W,s.y*H,s.r,0,6.283);ctx.fill()}
ctx.globalCompositeOperation='source-over';
for(const p of disk){const a=p.r*3.5+p.arm*2.094+p.j*5+time*.2,x=Math.cos(a)*p.r,z=Math.sin(a)*p.r;const angle=yaw*.2,xx=x*Math.cos(angle)-z*Math.sin(angle),zz=x*Math.sin(angle)+z*Math.cos(angle);ctx.fillStyle=`hsla(${145+16*Math.sin(p.r*2)},35%,${49+15/p.r}%,${.18+.23*(1-p.r/3)})`;ctx.fillRect(cx+xx*scale,base+(zz*.24+p.j)*scale,p.s,p.s)}
const halo=ctx.createRadialGradient(cx,base,2,cx,base,scale*.25);halo.addColorStop(0,'#fffaf0');halo.addColorStop(.07,'#aacdb5');halo.addColorStop(.15,'#8dbb9a90');halo.addColorStop(1,'transparent');ctx.fillStyle=halo;ctx.save();ctx.translate(cx,base);ctx.scale(1,.36);ctx.fillRect(-scale*.3,-scale*.3,scale*.6,scale*.6);ctx.restore();ctx.fillStyle='#f8f7ed';ctx.beginPath();ctx.ellipse(cx,base,scale*.08,scale*.025,0,0,6.283);ctx.fill();
const a=yaw+time*.43,ca=Math.cos(a),sa=Math.sin(a),pulse=1+.025*Math.sin(time*2);const pts=heart.map(p=>({x:p.x*ca+p.z*sa,y:p.y,z:-p.x*sa+p.z*ca,r:p.r,p:p.p})).sort((a,b)=>a.z-b.z);
for(const p of pts){const depth=3.6/(3.6-p.z),light=(p.z+1.2)/2.4,x=cx+p.x*scale*.74*depth*pulse,y=cy-p.y*scale*.74*depth*pulse;ctx.fillStyle=`hsla(${338+light*12},${45+light*20}%,${45+light*20}%,${.25+light*.64})`;const r=p.r*(.65+light*.55);ctx.beginPath();ctx.arc(x,y,r,0,6.283);ctx.fill();if(p.r>1.45&&light>.5){ctx.fillStyle='#dc96ab18';ctx.beginPath();ctx.arc(x,y,r*4,0,6.283);ctx.fill()}}
ctx.globalCompositeOperation='source-over';
// Text and floating keepsakes share the perspective of the galaxy.
const phrases=['HAPPY BIRTHDAY ♡',
'YOU + ME',
'MY FAVORITE PERSON',
'LITTLE MOMENTS ✧',
'LOVE YOU',
'POFIA TIN ♡',
'ALWAYS TOGETHER',
'SWEET AS YOU',
'OUR LITTLE WORLD',
'WITH ALL MY LOVE',
'POFIA TIN ♡',
'POFIA TIN ♡',
'POFIA TIN ♡',
'POFIA TIN ♡',
'POFIA TIN ♡',
'POFIA TIN ♡',
'POFIA TIN ♡',
'POFIA TIN ♡',
'POFIA TIN ♡',
'หมาแก่ หมาเด็ก ♡',
'หมาแก่ หมาเด็ก ♡',
'หมาแก่ หมาเด็ก ♡',
'หมาแก่ หมาเด็ก ♡',
'หมาแก่ หมาเด็ก ♡',
'หมาแก่ หมาเด็ก ♡',
];
ctx.textAlign='center';ctx.textBaseline='middle';
for(let i=0;i<phrases.length;i++){const a=i*2.399+time*.075+yaw*.22,r=1.25+(i%3)*.47,z=Math.sin(a)*r,x=Math.cos(a)*r;ctx.save();ctx.translate(cx+x*scale,base+z*scale*.28);ctx.rotate(Math.sin(a)*.1);const fs=Math.max(8,scale*(.035+(z+2.3)*.006));ctx.font=`bold ${fs}px monospace`;ctx.shadowColor='#d9a1b0';ctx.shadowBlur=0;ctx.fillStyle=`rgba(87,128,99,${.5+(z+2.3)*.1})`;ctx.fillText(phrases[i],0,0);ctx.restore()}
for(let i=0;i<13;i++){const a=i*2.4-time*.14+yaw*.2,r=.9+(i%4)*.43,x=cx+Math.cos(a)*r*scale,y=base+Math.sin(a)*r*scale*.29-15-Math.sin(time+i)*8;ctx.save();ctx.translate(x,y);const n=scale*(.014+(Math.sin(a)+1)*.008);ctx.scale(n,n);ctx.beginPath();ctx.moveTo(0,.3);ctx.bezierCurveTo(-1.8,-.8,-.9,-1.8,0,-.8);ctx.bezierCurveTo(.9,-1.8,1.8,-.8,0,.3);ctx.shadowColor='#dba0b3';ctx.shadowBlur=18;ctx.fillStyle='#de91aa';ctx.fill();ctx.restore()}
if(entered&&entryProgress<1){ctx.globalCompositeOperation='source-over';const strength=1-entryProgress;for(let i=0;i<95;i++){const a=i*2.399,r=((i*97+entryProgress*1000)%800)/800*Math.max(W,H);ctx.strokeStyle=`rgba(255,${120+i%100},220,${strength*.65})`;ctx.lineWidth=1+i%2;ctx.beginPath();ctx.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r*.7);ctx.lineTo(cx+Math.cos(a)*(r+strength*70),cy+Math.sin(a)*(r+strength*70)*.7);ctx.stroke()}ctx.globalCompositeOperation='source-over'}
}

function frame(t){const dt=lastT?Math.min((t-lastT)/1000,.05):0;lastT=t;if(entered&&playing&&!drag){time+=dt;entryProgress=Math.min(1,entryProgress+dt/2.4);draw()}requestAnimationFrame(frame)}
canvas.onpointerdown=e=>{drag=true;lastX=e.clientX;canvas.setPointerCapture(e.pointerId)};canvas.onpointermove=e=>{if(drag){yaw+=(e.clientX-lastX)*.008;lastX=e.clientX;draw()}};canvas.onpointerup=canvas.onpointercancel=()=>drag=false;
document.querySelector('#enter').onclick=()=>{entered=true;entryProgress=playing?0:1;document.body.classList.add('inside');const cover=document.querySelector('#welcome');cover.classList.add('leaving');setTimeout(()=>{cover.hidden=true;document.querySelector('.letter').focus()},600);draw()};
const motion=document.querySelector('#motion');function sync(){motion.textContent=playing?'Ⅱ หยุดการเคลื่อนไหว':'▷ เล่นการเคลื่อนไหว';motion.setAttribute('aria-pressed',String(!playing))}motion.onclick=()=>{playing=!playing;sync()};
const modal=document.querySelector('#modal'),content=document.querySelector('#content'),close=document.querySelector('#close');let opener=null,photoURL=null,photoData=null;const wishes=['ขอให้ปีนี้ได้เริ่มต้นสิ่งที่ฝันไว้\nและมีความกล้าพอที่จะลงมือทำในสิ่งใหม่ๆ ✨','ขอให้เจอความสุขในวันธรรมดา\nมีรอยยิ้มเล็กๆ ให้เก็บได้ทุกวัน 🌷','ขอให้มีคนรักพี่อย่างอ่อนโยน\nและอย่าลืมรักตัวเองด้วยนะ 🤍'];
function openGift(id,button){opener=button;content.replaceChildren(document.querySelector('#'+id).content.cloneNode(true));modal.hidden=false;document.querySelector('.card').focus();if(id==='wish'){content.querySelectorAll('.fortune').forEach(b=>b.onclick=()=>{content.querySelectorAll('.fortune').forEach(x=>x.classList.remove('chosen'));b.classList.add('chosen');content.querySelector('#fortuneText').textContent=wishes[+b.dataset.card]})}if(id==='memory'){const img=content.querySelector('#photo');if(photoData)img.src=photoData;else{const c=document.createElement('canvas');c.width=600;c.height=400;const g=c.getContext('2d');g.fillStyle='#150b20';g.fillRect(0,0,600,400);g.fillStyle='#dcb0ec';g.font='95px Georgia';g.textAlign='center';g.fillText('♡',300,205);g.font='18px Georgia';g.fillText('Our little memories',300,265);img.src=c.toDataURL()}content.querySelector('#photoInput').onchange=e=>{const f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return;if(photoURL)URL.revokeObjectURL(photoURL);photoURL=URL.createObjectURL(f);photoData=photoURL;img.src=photoURL;img.alt='ภาพความทรงจำที่เลือกจากเครื่อง'}}}
document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>openGift(b.dataset.open,b));function dismiss(){modal.hidden=true;opener?.focus()}close.onclick=dismiss;modal.onclick=e=>{if(e.target===modal)dismiss()};document.addEventListener('keydown',e=>{if(modal.hidden)return;if(e.key==='Escape')dismiss();if(e.key==='Tab'){const f=[...modal.querySelectorAll('button,input')],first=f[0],last=f[f.length-1];if(e.shiftKey&&(document.activeElement===first||document.activeElement.classList.contains('card'))){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});addEventListener('resize',size);sync();size();requestAnimationFrame(frame);
</script></body></html>
